[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pluto-factory"
version = "0.1.0"
description = "Local, durable prototype of the Pluto software factory"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "pydantic-ai-slim[openai]>=2.65,<3"]

[project.scripts]
pluto-factory = "pluto_factory.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

